document.getElementById('sPct').textContent=pct+'%';document.getElementById('progFill').style.width=pct+'%';
document.querySelectorAll('.tfill').forEach(b=>{const t=b.dataset.team;const ts=DATA.filter(d=>d.t===t);const to=ts.filter(d=>getState(d.c)===1).length;b.style.width=Math.round(to/ts.length*100)+'%';b.parentElement.nextElementSibling.textContent=to+'/'+ts.length;});
document.querySelectorAll('.gprog').forEach(g=>{const gs=DATA.filter(d=>d.g===g.dataset.group);const go=gs.filter(d=>getState(d.c)===1).length;g.textContent=go+'/'+gs.length;});
document.querySelectorAll('.toggle-btn[data-group]').forEach(b=>{const gs=DATA.filter(d=>d.g===b.dataset.group);b.textContent=gs.every(d=>getState(d.c)===1)?'❌ Borrar':'✅ Todas';});
document.querySelectorAll('.toggle-btn[data-team]').forEach(b=>{const ts=DATA.filter(d=>d.t===b.dataset.team);b.textContent=ts.every(d=>getState(d.c)===1)?'❌ Borrar':'✅ Todas';});}
function render(){
let h='';groups.forEach(g=>{
if(activeFilter!=='all'&&activeFilter!==g)return;
const gs=DATA.filter(d=>d.g===g),teams=[...new Set(gs.map(d=>d.t))];
const go=gs.filter(d=>getState(d.c)===1).length,allO=gs.every(d=>getState(d.c)===1);
const gi=g==='FWC'?'⚽ Especial FWC':g==='Coca-Cola'?CCL+' Coca-Cola':'⚽ '+g;
h+=`<div class="group-section collapsed" data-group="${g}"><div class="group-header" onclick="if(event.target.closest('.toggle-btn'))return;this.parentElement.classList.toggle('collapsed')"><h2>${gi}</h2><div class="gh-right"><button class="toggle-btn" data-group="${g}" onclick="event.stopPropagation();toggleGroup('${g}')">${allO?'❌ Borrar':'✅ Todas'}</button><span class="gprog" data-group="${g}">${go}/${gs.length}</span></div></div>`;
teams.forEach(t=>{
const ts=DATA.filter(d=>d.g===g&&d.t===t),to=ts.filter(d=>getState(d.c)===1).length,pc=Math.round(to/ts.length*100);
const allT=ts.every(d=>getState(d.c)===1);
h+=`<div class="team-section" data-team="${t}"><div class="team-header" onclick="if(event.target.closest('.toggle-btn'))return;toggleTeam(this)"><div style="display:flex;align-items:center;gap:8px;flex:1"><h3>${fi(t)} ${t}</h3><div class="tbar"><div class="tfill" data-team="${t}" style="width:${pc}%"></div></div><span class="tprog">${to}/${ts.length}</span></div><div class="th-right"><button class="toggle-btn" data-team="${t}" onclick="event.stopPropagation();toggleTeamAll('${t}')">${allT?'❌ Borrar':'✅ Todas'}</button></div></div><div class="stickers" style="display:none">`;
ts.forEach(s=>{const st=getState(s.c);let cl='sticker';if(s.f)cl+=' foil';if(s.c.startsWith('CC'))cl+=' coca';if(st===1)cl+=' owned';
h+=`<div class="${cl}" id="s_${s.c}" onclick="cycleState('${s.c}')"><span class="cam-btn" onclick="event.stopPropagation();showPreview('${s.c}')">\ud83d\udcf7</span><span class="code">${s.c}${s.f&&!s.c.startsWith('CC')?' ✨':''}</span><span class="name">${s.n}</span></div>`;});
h+='</div></div>';});h+='</div>';});
app.innerHTML=h;updateStats();}
function toggleTeam(el){const s=el.nextElementSibling;s.style.display=s.style.display==='none'?'grid':'none';}
function exportMissing(){
const missing=DATA.filter(d=>getState(d.c)===0);
if(!missing.length){showToast('\ud83c\udf89 ¡Álbum completo!');return;}
const byTeam={};const teamOrder=[];
missing.forEach(d=>{
if(!byTeam[d.t]){byTeam[d.t]=[];teamOrder.push(d.t);}
byTeam[d.t].push(d.c.replace(/^[A-Za-z]+/,''));
});
let text='Faltantes Mundial 2026 ('+missing.length+'/'+DATA.length+'):\n\n';
teamOrder.forEach(t=>{var pfx=TPFX[t];text+=t+(pfx?' ('+pfx+')':'')+': '+byTeam[t].join(', ')+'\n';});
navigator.clipboard.writeText(text.trim()).then(()=>showToast('\ud83d\udccb Lista copiada'));
}
function resetAll(){if(!confirm('¿Seguro que querés reiniciar todo?'))return;state={};localStorage.removeItem('panini2026v10');render();showToast('\ud83d\uddd1️ Reiniciado');}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
searchInput.addEventListener('input',()=>{
const q=searchInput.value.toLowerCase().trim();
if(!q){document.querySelectorAll('.group-section').forEach(g=>{g.classList.remove('s-hide');g.classList.add('collapsed');});document.querySelectorAll('.team-section').forEach(t=>t.classList.remove('s-hide'));document.querySelectorAll('.sticker').forEach(s=>s.classList.remove('hidden'));document.querySelectorAll('.stickers').forEach(s=>s.style.display='none');return;}
document.querySelectorAll('.group-section').forEach(gs=>{
let gMatch=false;
gs.querySelectorAll('.team-section').forEach(ts=>{
let tMatch=false;
ts.querySelectorAll('.sticker').forEach(s=>{const c=s.id.replace('s_','').toLowerCase(),n=s.querySelector('.name').textContent.toLowerCase();const m=c.includes(q)||n.includes(q);s.classList.toggle('hidden',!m);if(m)tMatch=true;});
ts.classList.toggle('s-hide',!tMatch);if(tMatch){ts.querySelector('.stickers').style.display='grid';gMatch=true;}else{ts.querySelector('.stickers').style.display='none';}});
gs.classList.toggle('s-hide',!gMatch);if(gMatch)gs.classList.remove('collapsed');});});
renderFilters();render();

</script>
</body>
</html>
